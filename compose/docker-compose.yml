services:
  postgres:
    image: postgres:17
    container_name: ai-postgres
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - /srv/ai-data/postgres:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    networks:
      - ai-platform-net

networks:
  ai-platform-net:
    driver: bridge